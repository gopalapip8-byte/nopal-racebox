<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOPAL RACEBOX</title>
<style>
:root{--bg:#0b0b0f;--card:#16161d;--tx:#f2f2f5;--mu:#8b8b99;--ac:#ff3b30;--ok:#30d158;--bd:#262631}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:0 auto;padding:16px;min-height:100vh}
h1{font-size:18px;letter-spacing:3px;margin:4px 0 16px;text-align:center}h1 b{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
input,select,button{font:inherit}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:12px}
button{cursor:pointer;border:0;border-radius:12px;font-weight:700}
.btn{width:100%;padding:16px;background:var(--ok);color:#fff;font-size:16px}
.btn:disabled{opacity:.5}
.err{color:var(--ac);font-size:13px;margin-top:8px;text-align:center;display:none}
.logout{position:fixed;top:12px;right:12px;background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:8px 12px;border-radius:10px;font-size:12px;z-index:99}
#app{display:none}
#loginBox{margin-top:40px}
.mu{color:var(--mu);font-size:12px;text-align:center;margin-top:12px}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="loginBox">
  <h1>NOPAL <b>RACEBOX</b></h1>
  <div class="card">
    <input type="text" id="username" placeholder="Username" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="btnLogin">Masuk</button>
    <div class="err" id="loginErr">Username atau password salah</div>
  </div>
  <p class="mu">Hubungi admin jika belum punya akun</p>
</div>

<!-- ========== APP (asli + logout) ========== -->
<button class="logout" id="btnLogout" style="display:none">Keluar</button>
<div id="app">
  <!-- Konten Racebox asli akan dimasukkan di sini -->
  <div id="raceboxRoot"></div>
</div>

<script>
/* ===================== USERS (edit lewat admin panel) ===================== */
const USERS = [
  { username: "admin", password: "nopal123", role: "admin" },
  { username: "user1", password: "racebox1", role: "user" },
  { username: "user2", password: "racebox2", role: "user" }
];
/* ======================================================================== */

const SESSION_KEY = "nopal_rb_session";

function checkLogin() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
    if (!s || !s.username) return false;
    const u = USERS.find(x => x.username === s.username && x.password === s.password);
    return !!u;
  } catch(e) { return false; }
}

function doLogin() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;
  const found = USERS.find(x => x.username === user && x.password === pass);
  const err = document.getElementById("loginErr");
  if (!found) {
    err.style.display = "block";
    return;
  }
  localStorage.setItem(SESSION_KEY, JSON.stringify({ username: found.username, password: found.password }));
  showApp();
}

function doLogout() {
  localStorage.removeItem(SESSION_KEY);
  location.reload();
}

function showApp() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("btnLogout").style.display = "block";
  loadRacebox();
}

document.getElementById("btnLogin").onclick = doLogin;
document.getElementById("btnLogout").onclick = doLogout;
document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

if (checkLogin()) showApp();

/* ===================== RACEBOX ASLI (disederhanakan + perbaikan akurasi) ===================== */
function loadRacebox() {
  // Load konten asli dari original, tapi kita embed versi yang sudah sedikit diperbaiki
  document.getElementById("raceboxRoot").innerHTML = `
<h1>NOPAL <b>RACEBOX</b></h1>
<div class="card">
  <div class="row" style="margin-bottom:8px">
    <span id="gpsStatus" style="font-size:13px;color:var(--mu)">GPS belum aktif</span>
    <button class="sm" id="btnTheme" style="padding:6px 10px;font-size:12px">Tema</button>
  </div>
  <div class="spd" id="speed">0</div>
  <div class="unit">km/jam</div>
  <div class="tim" id="timer">0.000</div>
  <div class="st" id="status">Pilih mode lalu tekan START</div>
  <div class="chips" id="modes"></div>
  <div class="btns">
    <button class="big" id="btnStart">START</button>
    <button class="sm" id="btnReset">Reset</button>
  </div>
  <div class="grid" style="margin-top:12px">
    <div><span class="mu">Top Speed</span><b id="top">0</b></div>
    <div><span class="mu">Jarak (m)</span><b id="dist">0</b></div>
    <div><span class="mu">Rekor Mode</span><b id="rek">-</b></div>
  </div>
</div>
<div class="card">
  <div class="row">
    <b>Riwayat Waktu</b>
    <div>
      <button class="sm" id="btnCsv" style="padding:6px 10px;font-size:12px">CSV</button>
      <button class="sm" id="btnClear" style="padding:6px 10px;font-size:12px">Hapus</button>
    </div>
  </div>
  <div id="hist" style="margin-top:10px;font-size:13px;max-height:200px;overflow:auto"></div>
</div>
<p class="mu" style="text-align:center;margin-top:8px">Gunakan hanya di sirkuit/lintasan tertutup. Jangan dilihat saat berkendara.</p>
`;

  // Inject style tambahan
  const st = document.createElement("style");
  st.textContent = `
.spd{font-size:72px;font-weight:800;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.unit{text-align:center;color:var(--mu);font-size:13px;margin-bottom:6px}
.tim{font-size:42px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
.st{text-align:center;font-weight:700;margin:6px 0;min-height:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0}
.chip{flex:0 0 auto;padding:8px 12px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-weight:600;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btns{display:flex;gap:8px;margin-top:10px}
.big{flex:1;padding:16px;border:0;border-radius:14px;font-weight:800;font-size:18px;color:#fff;background:var(--ok)}
.big.stop{background:var(--ac)}
.sm{padding:12px;border-radius:14px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.grid div{background:var(--bg);border-radius:10px;padding:8px}
.grid b{display:block;font-size:16px;margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center}
  `;
  document.head.appendChild(st);

  // ===== Logic Racebox (versi lebih akurat) =====
  const MODES = [
    {id:"0-100", label:"0-100", target:100},
    {id:"0-160", label:"0-160", target:160},
    {id:"0-200", label:"0-200", target:200},
    {id:"100-200", label:"100-200", target:200, from:100},
    {id:"1/4mi", label:"1/4 mil", distance:402.336},
    {id:"400m", label:"400 m", distance:400}
  ];

  let mode = MODES[0];
  let running = false;
  let startTime = 0;
  let watchId = null;
  let topSpeed = 0;
  let distance = 0;
  let lastPos = null;
  let started = false; // sudah melewati ambang gerak
  let history = JSON.parse(localStorage.getItem("nopal_hist") || "[]");

  const $ = id => document.getElementById(id);

  // Render modes
  const modesEl = $("modes");
  MODES.forEach(m => {
    const b = document.createElement("button");
    b.className = "chip" + (m === mode ? " on" : "");
    b.textContent = m.label;
    b.onclick = () => {
      if (running) return;
      mode = m;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      b.classList.add("on");
      $("status").textContent = "Mode " + m.label + " siap";
      updateRek();
    };
    modesEl.appendChild(b);
  });

  function updateRek() {
    const filtered = history.filter(h => h.mode === mode.id);
    if (filtered.length) {
      const best = Math.min(...filtered.map(h => h.ms));
      $("rek").textContent = (best/1000).toFixed(3) + "s";
    } else $("rek").textContent = "-";
  }
  updateRek();

  function fmt(ms) { return (ms/1000).toFixed(3); }

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // GPS dengan high accuracy + filter
  function startGPS() {
    if (!navigator.geolocation) {
      $("gpsStatus").textContent = "GPS tidak didukung";
      return;
    }
    $("gpsStatus").textContent = "Mencari GPS...";
    watchId = navigator.geolocation.watchPosition(pos => {
      const spd = (pos.coords.speed || 0) * 3.6; // m/s → km/h
      // Filter sederhana: abaikan lonjakan ekstrem
      const cleanSpd = (spd > 0 && spd < 400) ? spd : 0;
      $("speed").textContent = cleanSpd.toFixed(0);
      $("gpsStatus").textContent = "GPS aktif · akurasi ±" + Math.round(pos.coords.accuracy) + " m";

      if (!running) return;

      if (cleanSpd > topSpeed) {
        topSpeed = cleanSpd;
        $("top").textContent = topSpeed.toFixed(0);
      }

      // Hitung jarak
      if (lastPos) {
        const d = haversine(lastPos.lat, lastPos.lon, pos.coords.latitude, pos.coords.longitude);
        if (d < 50) distance += d; // filter outlier
        $("dist").textContent = Math.round(distance);
      }
      lastPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };

      // Timer logic
      const now = performance.now();
      if (!started && cleanSpd >= 5) { // ambang gerak 5 km/h
        started = true;
        startTime = now;
      }
      if (started) {
        const elapsed = now - startTime;
        $("timer").textContent = fmt(elapsed);

        // Cek target
        let done = false;
        if (mode.target) {
          if (mode.from) {
            if (cleanSpd >= mode.from && !window._fromReached) window._fromReached = true;
            if (window._fromReached && cleanSpd >= mode.target) done = true;
          } else {
            if (cleanSpd >= mode.target) done = true;
          }
        }
        if (mode.distance && distance >= mode.distance) done = true;

        if (done) {
          stopRun(elapsed);
        }
      }
    }, err => {
      $("gpsStatus").textContent = "GPS error: " + err.message;
    }, {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    });
  }

  function stopRun(ms) {
    running = false;
    started = false;
    window._fromReached = false;
    $("btnStart").textContent = "START";
    $("btnStart").classList.remove("stop");
    $("status").textContent = "Selesai! " + fmt(ms) + " detik";
    if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }

    // Simpan history
    history.unshift({ mode: mode.id, ms, top: topSpeed, dist: distance, ts: Date.now() });
    if (history.length > 50) history.pop();
    localStorage.setItem("nopal_hist", JSON.stringify(history));
    renderHist();
    updateRek();
  }

  $("btnStart").onclick = () => {
    if (running) {
      stopRun(performance.now() - startTime);
      return;
    }
    // Reset
    topSpeed = 0; distance = 0; lastPos = null; started = false; window._fromReached = false;
    $("top").textContent = "0"; $("dist").textContent = "0"; $("timer").textContent = "0.000";
    running = true;
    $("btnStart").textContent = "STOP";
    $("btnStart").classList.add("stop");
    $("status").textContent = "Siap... gerakkan mobil";
    startGPS();
  };

  $("btnReset").onclick = () => {
    if (running) return;
    topSpeed = 0; distance = 0;
    $("top").textContent = "0"; $("dist").textContent = "0"; $("timer").textContent = "0.000";
    $("status").textContent = "Pilih mode lalu tekan START";
  };

  function renderHist() {
    const h = $("hist");
    if (!history.length) { h.innerHTML = "<span class='mu'>Belum ada data</span>"; return; }
    h.innerHTML = history.slice(0,20).map(r => 
      `<div style="padding:6px 0;border-bottom:1px solid var(--bd)">${r.mode} · <b>${fmt(r.ms)}s</b> · top ${r.top.toFixed(0)} · ${new Date(r.ts).toLocaleString("id")}</div>`
    ).join("");
  }
  renderHist();

  $("btnClear").onclick = () => {
    if (confirm("Hapus semua riwayat?")) {
      history = [];
      localStorage.setItem("nopal_hist", "[]");
      renderHist();
      updateRek();
    }
  };

  $("btnCsv").onclick = () => {
    let csv = "mode,waktu_s,top_speed,jarak_m,tanggal\n";
    history.forEach(r => csv += `${r.mode},${(r.ms/1000).toFixed(3)},${r.top.toFixed(1)},${Math.round(r.dist)},${new Date(r.ts).toISOString()}\n`);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
    a.download = "nopal-racebox.csv";
    a.click();
  };

  $("btnTheme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute("data-theme", cur === "light" ? "dark" : "light");
  };

  // Mulai GPS status
  startGPS();
}
</script>
</body>
</html>
