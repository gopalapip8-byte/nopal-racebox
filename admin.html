<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - NOPAL RACEBOX</title>
<style>
:root{--bg:#0b0b0f;--card:#16161d;--tx:#f2f2f5;--mu:#8b8b99;--ac:#ff3b30;--ok:#30d158;--bd:#262631}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:0 auto;padding:20px}
h1{font-size:20px;margin-bottom:16px}h1 b{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);width:100%;margin-bottom:10px}
input{background:var(--bg);color:var(--tx)}
button{cursor:pointer;font-weight:700;border:0}
.btn{background:var(--ok);color:#fff}
.btn-danger{background:var(--ac);color:#fff}
.btn-sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:600}
.err{color:var(--ac);font-size:13px;display:none;margin-top:6px}
.mu{color:var(--mu);font-size:13px}
code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:12px}
textarea{width:100%;height:180px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;font-family:ui-monospace,monospace;font-size:12px}
#panel{display:none}
</style>
</head>
<body>

<div id="loginAdmin">
  <h1>Panel Admin <b>NOPAL</b></h1>
  <div class="card">
    <input type="password" id="adminPass" placeholder="Password Admin">
    <button class="btn" id="btnAdminLogin">Masuk Admin</button>
    <div class="err" id="adminErr">Password salah</div>
  </div>
  <p class="mu">Hanya untuk pemilik. Password default: <code>nopaladmin</code></p>
</div>

<div id="panel">
  <h1>Kelola Akun</h1>

  <div class="card">
    <h3 style="margin-bottom:12px">Tambah User Baru</h3>
    <input type="text" id="newUser" placeholder="Username baru">
    <input type="text" id="newPass" placeholder="Password baru">
    <button class="btn" id="btnAdd">Tambah Akun</button>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">Daftar User Saat Ini</h3>
    <table>
      <thead><tr><th>Username</th><th>Password</th><th>Role</th><th></th></tr></thead>
      <tbody id="userTable"></tbody>
    </table>
  </div>

  <div class="card">
    <h3 style="margin-bottom:8px">Kode untuk di-update ke index.html</h3>
    <p class="mu" style="margin-bottom:10px">Copy semua kode di bawah ini, lalu ganti bagian <code>const USERS = [...]</code> di file <b>index.html</b></p>
    <textarea id="codeOut" readonly></textarea>
    <button class="btn-sec" id="btnCopy" style="margin-top:10px">Salin Kode</button>
  </div>

  <button class="btn-sec" id="btnLogoutAdmin" style="margin-top:10px">Keluar Admin</button>
</div>

<script>
/* Password admin (ganti ini kalau mau) */
const ADMIN_PASSWORD = "nopaladmin";

/* Data user (harus sama dengan yang di index.html) */
let USERS = [
  { username: "admin", password: "nopal123", role: "admin" },
  { username: "user1", password: "racebox1", role: "user" },
  { username: "user2", password: "racebox2", role: "user" }
];

const $ = id => document.getElementById(id);

function render() {
  const tbody = $("userTable");
  tbody.innerHTML = "";
  USERS.forEach((u, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${u.username}</td>
      <td>${u.password}</td>
      <td>${u.role}</td>
      <td><button class="btn-danger" style="padding:6px 10px;width:auto;font-size:12px" data-i="${i}">Hapus</button></td>
    `;
    tbody.appendChild(tr);
  });

  // Generate code
  const code = `const USERS = ${JSON.stringify(USERS, null, 2)};`;
  $("codeOut").value = code;
}

$("btnAdminLogin").onclick = () => {
  if ($("adminPass").value === ADMIN_PASSWORD) {
    $("loginAdmin").style.display = "none";
    $("panel").style.display = "block";
    render();
  } else {
    $("adminErr").style.display = "block";
  }
};

$("btnAdd").onclick = () => {
  const u = $("newUser").value.trim();
  const p = $("newPass").value.trim();
  if (!u || !p) return alert("Isi username & password");
  if (USERS.some(x => x.username === u)) return alert("Username sudah ada");
  USERS.push({ username: u, password: p, role: "user" });
  $("newUser").value = "";
  $("newPass").value = "";
  render();
};

$("userTable").onclick = e => {
  if (e.target.tagName === "BUTTON") {
    const i = +e.target.dataset.i;
    if (USERS[i].username === "admin") return alert("Akun admin tidak boleh dihapus");
    if (confirm("Hapus user " + USERS[i].username + "?")) {
      USERS.splice(i, 1);
      render();
    }
  }
};

$("btnCopy").onclick = () => {
  $("codeOut").select();
  document.execCommand("copy");
  alert("Kode berhasil disalin!\n\nSekarang buka index.html → cari const USERS = [...] → ganti dengan kode yang baru disalin → upload lagi ke GitHub.");
};

$("btnLogoutAdmin").onclick = () => location.reload();
</script>
</body>
</html>
